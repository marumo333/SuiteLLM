name: feature-gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: pnpm
        run: corepack enable && corepack prepare pnpm@10.33.3 --activate && pnpm install --frozen-lockfile
      - name: feature-gate を実行する
        run: |
          set -euo pipefail
          data_root="${GITHUB_WORKSPACE}"
          gate="scripts/feature-gate.mjs"
          if git cat-file -e origin/main:scripts/feature-gate.mjs 2>/dev/null; then
            tmp="$(mktemp -d)"
            git archive origin/main scripts | tar -x -C "$tmp"
            ln -s "${data_root}/node_modules" "${tmp}/node_modules"
            gate="${tmp}/scripts/feature-gate.mjs"
          fi
          HARNESS_ROOT="${data_root}" node "${gate}"
      - name: ハーネス単体テスト
        run: node scripts/run-harness-tests.mjs
      - name: コミット主語を検査する
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          lint_script="scripts/lint-commit-range.mjs"
          if git cat-file -e origin/main:scripts/lint-commit-range.mjs 2>/dev/null; then
            tmp="$(mktemp -d)"
            git archive origin/main scripts | tar -x -C "$tmp"
            lint_script="$tmp/scripts/lint-commit-range.mjs"
          fi
          if [ -n "${PR_HEAD}" ]; then
            node "$lint_script" --tip "${PR_HEAD}"
          else
            node "$lint_script" --tip
          fi
